<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direzione Auto | Showroom</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; min-height: 100vh; }
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: white; z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .social-icon-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .social-link:hover .social-icon-img {
            transform: scale(1.15);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="flex flex-col items-center gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-[#D4AF37]"></div>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400">Caricamento...</p>
        </div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // CONFIGURAZIONE DEL TEMPLATE
        // ==========================================
        const CONFIG = {
            nomeConcessionaria: "Direzione Auto",
            citta: "Barrafranca",
            provinciaBreve: "EN",
            provinciaEstesa: "Provincia di Enna",
            cap: "94012",
            
            sottotitoloHero: "Esperienza, import/export e passione per le auto al tuo servizio.",
            descrizioneFooter: "Vendita auto con passione da oltre 20 anni. Esperienza nel settore import ed export a tua disposizione.",
            
            heroImages: [
                "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&q=80&w=1600",
                "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&q=80&w=1600",
                "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&q=80&w=1600"
            ],

            indirizzo: "Corso Vittorio Emanuele 465",
            telefonoMostrato: "+39 352 097 9989",
            telefonoLink: "+393520979989",
            whatsappNumber: "393520979989",
            email: "info@direzioneauto.it",
            
            social: {
                instagram: "",
                facebook: "https://www.facebook.com/people/Direzione-Auto/61589701618386/?rdid=GoruiGBQuOVDDg7E&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1Cka6NKLYh%2F%3Fref%3D1",
                autosupermarket: ""
            },
            linkGoogleFormValutazione: "https://docs.google.com/forms/d/e/1FAIpQLSeYtcqgrOejvWqClIlEUneC2LPtTNzf67413H_mxFtcnGdnbw/viewform?embedded=true",
            
            chiSiamo: {
                titoloOrigini: "La passione per i motori del nostro Gruppo",
                paragrafo1: "La storia del nostro Gruppo e dell'Amministratore Unico Rosario Gagliano nasce da una profonda e radicata passione per le automobili. Circa 20 anni fa, Rosario ha avuto il suo primo approccio nel settore automotive iniziando con la formula del conto vendita, trasformando una passione in una vera e propria esperienza formativa ed imprenditoriale.",
                paragrafo2: "Forte di queste basi, negli anni il Gruppo ha sviluppato e affinato competenze solide, specializzandosi anche nelle dinamiche complesse del mercato import ed export di veicoli. Oggi, Direzione Auto rappresenta il frutto di questo lungo percorso, offrendo ai clienti un servizio affidabile, trasparente e veicoli selezionati con estrema cura.",
                citazione: "Ho iniziato vent'anni fa vendendo auto in conto vendita per pura passione. Oggi, guidando questo Gruppo e grazie all'esperienza maturata anche nell'import/export, continuo a selezionare ogni veicolo con la stessa attenzione e dedizione di un tempo.",
                nomeFondatore: "Rosario Gagliano",
                ruoloFondatore: "Amministratore Unico",
                inizialeFondatore: "R"
            },

            firebase: {
                apiKey: "AIzaSyCB5yV6u4DtzUFb0jADUJobh8In52JNzp4",
                authDomain: "maxcar-7416d.firebaseapp.com",
                projectId: "maxcar-7416d",
                storageBucket: "maxcar-7416d.firebasestorage.app",
                messagingSenderId: "279232212865",
                appId: "1:279232212865:web:4f83efdeff7306e0bb4280",
                measurementId: "G-ZYR2X61ZNE"
            },
            dbAppId: "direzione-auto" 
        };

        if (!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const COLLECTION_PATH = `artifacts/${CONFIG.dbAppId}/public/data/automobili`;

        const IG_ICON = "https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg";
        const FB_ICON = "https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg";
        const LOGO_PRINCIPALE = "Logo3.png";
        const LOGO_AUTOSUPERMARKET = "unnamed.png";

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [selectedCar, setSelectedCar] = useState(null);
            const [autoList, setAutoList] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeImage, setActiveImage] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const [currentHeroImage, setCurrentHeroImage] = useState(0);
            const [user, setUser] = useState(null);
            const [showMobileFilters, setShowMobileFilters] = useState(false);
            const [filters, setFilters] = useState({
                searchQuery: '',
                marca: '',
                categoria: 'Tutte',
                prezzoMax: '',
                annoMin: '',
                kmMax: '',
                alimentazione: '',
                cambio: ''
            });

            const handleFilterChange = (e) => {
                const { name, value } = e.target;
                setFilters(prev => ({ ...prev, [name]: value }));
            };

            const resetFilters = () => {
                setFilters({ searchQuery: '', marca: '', categoria: 'Tutte', prezzoMax: '', annoMin: '', kmMax: '', alimentazione: '', cambio: '' });
            };

            const nascondiLoader = () => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
                setLoading(false);
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (error) {
                        console.error("Errore Auth:", error);
                        nascondiLoader();
                    }
                };
                initAuth();

                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsubscribe = db.collection(COLLECTION_PATH).onSnapshot(
                    (snapshot) => {
                        const cars = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setAutoList(cars);
                        nascondiLoader();
                    },
                    (error) => {
                        console.error("Errore fetch:", error);
                        nascondiLoader();
                    }
                );

                return () => unsubscribe();
            }, [user]);

            const marcheDisponibili = useMemo(() => [...new Set(autoList.map(a => a.marca))].sort(), [autoList]);
            const alimentazioniDisponibili = useMemo(() => [...new Set(autoList.map(a => a.alimentazione))].sort(), [autoList]);
            const cambiDisponibili = useMemo(() => [...new Set(autoList.map(a => a.cambio || 'Manuale'))].sort(), [autoList]);

            const autoFiltrate = useMemo(() => {
                return autoList.filter(car => {
                    const matchSearch = !filters.searchQuery || `${car.marca} ${car.modello} ${car.descrizione || ''}`.toLowerCase().includes(filters.searchQuery.toLowerCase());
                    const matchMarca = !filters.marca || car.marca === filters.marca;
                    const matchCategoria = filters.categoria === 'Tutte' || car.categoria === filters.categoria;
                    const matchPrezzo = !filters.prezzoMax || Number(car.prezzo) <= Number(filters.prezzoMax);
                    const matchAnno = !filters.annoMin || Number(car.anno) >= Number(filters.annoMin);
                    const matchKm = !filters.kmMax || Number(car.km) <= Number(filters.kmMax);
                    const matchAlimentazione = !filters.alimentazione || car.alimentazione === filters.alimentazione;
                    const matchCambio = !filters.cambio || (car.cambio || 'Manuale') === filters.cambio;
                    
                    return matchSearch && matchMarca && matchCategoria && matchPrezzo && matchAnno && matchKm && matchAlimentazione && matchCambio;
                });
            }, [autoList, filters]);

            const homeAutoFiltrate = useMemo(() => {
                return autoList.slice(0, 6);
            }, [autoList]);

            useEffect(() => {
                document.title = `${CONFIG.nomeConcessionaria} | Showroom e Occasioni`;
            }, []);

            useEffect(() => {
                if (currentPage !== 'home') return;
                const interval = setInterval(() => {
                    setCurrentHeroImage((prev) => (prev + 1) % CONFIG.heroImages.length);
                }, 3000);
                return () => clearInterval(interval);
            }, [currentPage]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [currentPage, autoList, filters, selectedCar, isMobileMenuOpen, showMobileFilters]);

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentPage, selectedCar]);

            const openCarDetails = (car) => {
                setSelectedCar(car);
                setActiveImage(car.immagine);
                setCurrentPage('prodotto');
            };

            const carImages = useMemo(() => {
                if (!selectedCar) return [];
                const images = [selectedCar.immagine];
                if (selectedCar.galleria && Array.isArray(selectedCar.galleria)) {
                    selectedCar.galleria.forEach(img => {
                        if (img !== selectedCar.immagine) images.push(img);
                    });
                }
                return images;
            }, [selectedCar]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 overflow-x-hidden w-full">
                    {/* Header Fisso */}
                    <header className="sticky top-0 z-50 w-full flex flex-col shadow-sm">
                        {/* Navigazione Principale */}
                        <nav className="bg-white/95 backdrop-blur-md px-6 py-4 w-full border-b border-[#D4AF37]/20">
                            <div className="max-w-[90rem] mx-auto flex justify-between items-center gap-4">
                                
                                {/* Logo Principale */}
                                <div className="flex items-center gap-6 lg:gap-8 flex-shrink-0">
                                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setCurrentPage('home'); setSelectedCar(null); setIsMobileMenuOpen(false); }}>
                                        <img src="Logo.png" alt="Direzione Auto" className="h-14 md:h-18 object-contain" />
                                    </div>
                                </div>
                                
                                {/* Desktop Menu (Destra) */}
                                <div className="hidden lg:flex flex-wrap justify-end gap-x-6 gap-y-2 text-[10px] xl:text-xs font-bold uppercase tracking-widest text-slate-500 items-center">
                                    <button onClick={() => { setCurrentPage('home'); setSelectedCar(null); }} className={`hover:text-[#D4AF37] transition ${currentPage === 'home' ? 'text-[#D4AF37]' : ''}`}>Home</button>
                                    <button onClick={() => { setCurrentPage('showroom'); setSelectedCar(null); }} className={`hover:text-[#D4AF37] transition ${currentPage === 'showroom' ? 'text-[#D4AF37]' : ''}`}>Showroom</button>
                                    <button onClick={() => { setCurrentPage('vendi'); setSelectedCar(null); }} className={`hover:text-[#D4AF37] transition ${currentPage === 'vendi' ? 'text-[#D4AF37]' : ''}`}>Vendi Auto</button>
                                    <button onClick={() => { setCurrentPage('chisiamo'); setSelectedCar(null); }} className={`hover:text-[#D4AF37] transition ${currentPage === 'chisiamo' ? 'text-[#D4AF37]' : ''}`}>Chi Siamo</button>
                                    <button onClick={() => { setCurrentPage('lavoraconnoi'); setSelectedCar(null); }} className={`hover:text-[#D4AF37] transition ${currentPage === 'lavoraconnoi' ? 'text-[#D4AF37]' : ''}`}>Lavora con noi</button>
                                    <button onClick={() => { setCurrentPage('contatti'); setSelectedCar(null); }} className={`hover:text-[#D4AF37] transition ${currentPage === 'contatti' ? 'text-[#D4AF37]' : ''}`}>Contatti</button>
                                </div>

                                {/* Mobile Menu Button */}
                                <button className="lg:hidden text-slate-900 focus:outline-none p-2 flex-shrink-0" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                    <i data-lucide={isMobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
                                </button>
                            </div>

                            {/* Mobile Dropdown */}
                            {isMobileMenuOpen && (
                                <div className="lg:hidden absolute top-full left-0 w-full bg-white border-b border-[#D4AF37]/20 shadow-2xl flex flex-col py-6 px-8 gap-6 text-sm font-bold uppercase tracking-widest text-slate-600 animate-in slide-in-from-top-2 duration-300">
                                    <button onClick={() => { setCurrentPage('home'); setSelectedCar(null); setIsMobileMenuOpen(false); }} className={`text-left hover:text-[#D4AF37] transition ${currentPage === 'home' ? 'text-[#D4AF37]' : ''}`}>Home</button>
                                    <button onClick={() => { setCurrentPage('showroom'); setSelectedCar(null); setIsMobileMenuOpen(false); }} className={`text-left hover:text-[#D4AF37] transition ${currentPage === 'showroom' ? 'text-[#D4AF37]' : ''}`}>Showroom</button>
                                    <button onClick={() => { setCurrentPage('vendi'); setSelectedCar(null); setIsMobileMenuOpen(false); }} className={`text-left hover:text-[#D4AF37] transition ${currentPage === 'vendi' ? 'text-[#D4AF37]' : ''}`}>Vendi Auto</button>
                                    <button onClick={() => { setCurrentPage('chisiamo'); setSelectedCar(null); setIsMobileMenuOpen(false); }} className={`text-left hover:text-[#D4AF37] transition ${currentPage === 'chisiamo' ? 'text-[#D4AF37]' : ''}`}>Chi Siamo</button>
                                    <button onClick={() => { setCurrentPage('lavoraconnoi'); setSelectedCar(null); setIsMobileMenuOpen(false); }} className={`text-left hover:text-[#D4AF37] transition ${currentPage === 'lavoraconnoi' ? 'text-[#D4AF37]' : ''}`}>Lavora con noi</button>
                                    <button onClick={() => { setCurrentPage('contatti'); setSelectedCar(null); setIsMobileMenuOpen(false); }} className={`text-left hover:text-[#D4AF37] transition ${currentPage === 'contatti' ? 'text-[#D4AF37]' : ''}`}>Contatti</button>
                                </div>
                            )}
                        </nav>
                    </header>

                    <main className="flex-grow w-full">
                        {currentPage === 'home' && (
                            <>
                                <div className="relative min-h-[80vh] flex items-center justify-center text-center text-white px-4 overflow-hidden">
                                    {/* Slider Immagini di Sfondo */}
                                    {CONFIG.heroImages.map((img, index) => (
                                        <div 
                                            key={index}
                                            className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${index === currentHeroImage ? 'opacity-100 z-0' : 'opacity-0 z-0'}`}
                                            style={{
                                                backgroundImage: `linear-gradient(rgba(15, 23, 42, 0.75), rgba(0, 0, 0, 0.9)), url('${img}')`,
                                                backgroundSize: 'cover',
                                                backgroundPosition: 'center'
                                            }}
                                        ></div>
                                    ))}

                                    {/* Contenuto Hero */}
                                    <div className="relative z-10 max-w-3xl animate-in fade-in slide-in-from-bottom-10 duration-1000">
                                        <p className="text-sm md:text-base font-bold uppercase tracking-[0.3em] text-[#D4AF37] mb-4 drop-shadow-md">Barrafranca (Sicilia, Enna)</p>
                                        <h1 className="text-6xl md:text-8xl font-extrabold uppercase italic tracking-tighter mb-6 drop-shadow-xl">{CONFIG.nomeConcessionaria}</h1>
                                        <p className="text-xl md:text-2xl font-light mb-10 text-slate-200 drop-shadow-md">{CONFIG.sottotitoloHero}</p>
                                        <div className="flex flex-col md:flex-row gap-4 justify-center">
                                            <button onClick={() => setCurrentPage('showroom')} className="bg-[#D4AF37] text-black hover:bg-white hover:text-black px-12 py-5 rounded-xl font-black uppercase transition duration-300 shadow-2xl hover:scale-105 transform">Esplora lo Showroom</button>
                                            <a href={`tel:${CONFIG.telefonoLink}`} className="bg-white/10 hover:bg-[#D4AF37] hover:text-black hover:border-[#D4AF37] backdrop-blur-md px-12 py-5 rounded-xl font-bold uppercase transition duration-300 border border-[#D4AF37]/50 hover:scale-105 transform">Chiama Ora</a>
                                        </div>
                                    </div>
                                </div>
                                <div className="py-20 px-6 bg-white border-y border-[#D4AF37]/10">
                                    <div className="max-w-[90rem] mx-auto grid sm:grid-cols-2 lg:grid-cols-4 gap-12">
                                        <div className="flex flex-col items-center text-center group hover:-translate-y-3 transition-transform duration-500 cursor-default">
                                            <div className="w-16 h-16 bg-[#D4AF37]/10 text-[#D4AF37] rounded-3xl flex items-center justify-center mb-6 shadow-sm group-hover:bg-[#D4AF37] group-hover:text-black transition-colors duration-500"><i data-lucide="shield-check" className="w-8 h-8"></i></div>
                                            <h3 className="font-black uppercase italic text-xl mb-3 text-slate-900">Garanzia Totale</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed">Offriamo garanzie complete fino a 12 mesi su ogni veicolo per la tua massima tranquillità.</p>
                                        </div>
                                        <div className="flex flex-col items-center text-center group hover:-translate-y-3 transition-transform duration-500 cursor-default">
                                            <div className="w-16 h-16 bg-[#D4AF37]/10 text-[#D4AF37] rounded-3xl flex items-center justify-center mb-6 shadow-sm group-hover:bg-[#D4AF37] group-hover:text-black transition-colors duration-500"><i data-lucide="wallet" className="w-8 h-8"></i></div>
                                            <h3 className="font-black uppercase italic text-xl mb-3 text-slate-900">Finanziamenti</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed">Soluzioni finanziarie personalizzate e flessibili per permetterti di guidare l'auto dei tuoi sogni.</p>
                                        </div>
                                        <div className="flex flex-col items-center text-center group hover:-translate-y-3 transition-transform duration-500 cursor-default">
                                            <div className="w-16 h-16 bg-[#D4AF37]/10 text-[#D4AF37] rounded-3xl flex items-center justify-center mb-6 shadow-sm group-hover:bg-[#D4AF37] group-hover:text-black transition-colors duration-500"><i data-lucide="car-front" className="w-8 h-8"></i></div>
                                            <h3 className="font-black uppercase italic text-xl mb-3 text-slate-900">Noleggio No Scoring</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed">Possibilità di noleggio a lungo o breve termine senza scoring e senza l'uso di carte di credito.</p>
                                        </div>
                                        <div className="flex flex-col items-center text-center group hover:-translate-y-3 transition-transform duration-500 cursor-default">
                                            <div className="w-16 h-16 bg-[#D4AF37]/10 text-[#D4AF37] rounded-3xl flex items-center justify-center mb-6 shadow-sm group-hover:bg-[#D4AF37] group-hover:text-black transition-colors duration-500"><i data-lucide="zap" className="w-8 h-8"></i></div>
                                            <h3 className="font-black uppercase italic text-xl mb-3 text-slate-900">Velocità</h3>
                                            <p className="text-slate-500 text-sm leading-relaxed">Pratiche rapide e compravendita sicura. Siamo operativi in tutta la zona e dintorni.</p>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                        
                        {currentPage === 'home' && (
                            <div className="py-16 px-6 max-w-[90rem] mx-auto">
                                <div className="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 border-b border-slate-200 pb-8">
                                    <h2 className="text-4xl font-black uppercase italic tracking-tight flex-shrink-0 text-slate-900">Vetrina <span className="text-[#D4AF37] underline">Occasioni</span></h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 mb-12">
                                    {homeAutoFiltrate.map(car => (
                                        <div key={car.id} onClick={() => openCarDetails(car)} className="bg-white rounded-[2rem] overflow-hidden shadow-xl hover:shadow-2xl transition duration-500 border border-slate-100 group cursor-pointer">
                                            <div className="h-64 overflow-hidden relative">
                                                <img src={car.immagine} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt={car.modello} />
                                                <div className="absolute top-4 left-4 bg-slate-900/90 text-[#D4AF37] backdrop-blur px-3 py-1 rounded-full text-[10px] font-black shadow-sm uppercase tracking-widest">{car.categoria}</div>
                                                <div className="absolute top-4 right-4 bg-[#D4AF37] text-black px-3 py-1 rounded-full text-[10px] font-black shadow-lg uppercase tracking-widest">{car.condizione || "Occasione"}</div>
                                                <div className="absolute bottom-4 right-4 bg-slate-900 text-[#D4AF37] px-4 py-2 rounded-2xl font-black text-xl shadow-lg border border-[#D4AF37]/30">€{Number(car.prezzo)?.toLocaleString()}</div>
                                            </div>
                                            <div className="p-8">
                                                <h3 className="font-black uppercase text-2xl mb-1 tracking-tighter text-slate-900 leading-none">{car.marca}</h3>
                                                <p className="text-[#D4AF37] font-bold uppercase text-sm mb-4">{car.modello}</p>
                                                <div className="flex items-center justify-between text-slate-400 text-[10px] font-bold uppercase border-t pt-4">
                                                    <span className="flex items-center gap-1"><i data-lucide="calendar" className="w-3 h-3 text-[#D4AF37]"></i> {car.anno}</span>
                                                    <span className="flex items-center gap-1"><i data-lucide="gauge" className="w-3 h-3 text-[#D4AF37]"></i> {Number(car.km)?.toLocaleString()} KM</span>
                                                    <span className="flex items-center gap-1"><i data-lucide="fuel" className="w-3 h-3 text-[#D4AF37]"></i> {car.alimentazione}</span>
                                                </div>
                                                <button className="w-full mt-8 bg-slate-900 text-white py-4 rounded-xl font-bold text-[11px] uppercase tracking-widest group-hover:bg-[#D4AF37] group-hover:text-black transition duration-300">Visualizza Dettagli</button>
                                            </div>
                                        </div>
                                    ))}
                                    {homeAutoFiltrate.length === 0 && (
                                        <div className="col-span-1 md:col-span-2 lg:col-span-3 text-center py-12">
                                            <p className="text-slate-500 font-bold uppercase text-sm tracking-widest">Nessun veicolo trovato per questa selezione.</p>
                                        </div>
                                    )}

                                                <a href={CONFIG.social.facebook} target="_blank" className="bg-[#1877F2] text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-4 hover:bg-blue-700 transition shadow-lg transform hover:-translate-y-1">
                                                    <img src={FB_ICON} className="w-5 h-5" alt="Facebook" /> Facebook
                                                </a>
                                            )}
                                            {CONFIG.social.autosupermarket && (
                                                <a href={CONFIG.social.autosupermarket} target="_blank" className="bg-slate-900 text-[#D4AF37] py-5 rounded-2xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-4 hover:bg-[#D4AF37] hover:text-black transition shadow-lg transform hover:-translate-y-1">
                                                    <img src={LOGO_AUTOSUPERMARKET} className="w-6 h-6 rounded-md bg-white p-0.5" alt="Autosupermarket" /> Autosupermarket
                                                </a>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentPage === 'vendi' && (
                            <div className="py-24 px-6 max-w-5xl mx-auto animate-in fade-in duration-700">
                                <h2 className="text-5xl font-black uppercase italic mb-8 text-center text-slate-900">Vendi la tua <span className="text-[#D4AF37]">Auto</span></h2>
                                <p className="text-center text-slate-500 font-bold mb-12 text-sm">Compila il modulo sottostante con i dati del tuo veicolo per ricevere una valutazione gratuita e senza impegno.</p>
                                <div className="bg-white p-4 md:p-8 rounded-[3rem] shadow-xl border border-slate-100 flex justify-center w-full h-[900px]">
                                    <iframe 
                                        src={CONFIG.linkGoogleFormValutazione} 
                                        width="100%" 
                                        height="100%" 
                                        frameBorder="0" 
                                        marginHeight="0" 
                                        marginWidth="0"
                                        className="rounded-2xl"
                                    >Caricamento in corso…</iframe>
                                </div>
                            </div>
                        )}

                        {currentPage === 'chisiamo' && (
                            <div className="py-24 px-6 max-w-7xl mx-auto animate-in fade-in duration-700">
                                <div className="text-center mb-16">
                                    <h2 className="text-5xl md:text-6xl font-black uppercase italic tracking-tighter text-slate-900 mb-6">Chi <span className="text-[#D4AF37]">Siamo</span></h2>
                                    <p className="text-xl text-slate-500 font-bold max-w-3xl mx-auto">La passione per i motori al tuo servizio. Scopri la storia di {CONFIG.nomeConcessionaria} e il nostro impegno per garantirti sempre il meglio.</p>
                                </div>

                                <div className="grid lg:grid-cols-2 gap-16 items-center mb-24">
                                    <div className="space-y-6">
                                        <h3 className="text-3xl font-black uppercase italic text-slate-900">{CONFIG.chiSiamo.titoloOrigini}</h3>
                                        <p className="text-slate-600 leading-relaxed text-lg" dangerouslySetInnerHTML={{__html: CONFIG.chiSiamo.paragrafo1}}></p>
                                        <p className="text-slate-600 leading-relaxed text-lg" dangerouslySetInnerHTML={{__html: CONFIG.chiSiamo.paragrafo2}}></p>
                                    </div>
                                    <div className="bg-slate-900 rounded-[3rem] p-8 md:p-12 shadow-2xl text-white relative overflow-hidden border border-[#D4AF37]/20">
                                        <div className="absolute top-0 right-0 p-8 opacity-10 text-[#D4AF37]"><i data-lucide="quote" className="w-24 h-24"></i></div>
                                        <div className="relative z-10">
                                            <i data-lucide="car" className="w-12 h-12 text-[#D4AF37] mb-6"></i>
                                            <p className="text-xl md:text-2xl font-light italic leading-relaxed mb-8">
                                                "{CONFIG.chiSiamo.citazione}"
                                            </p>
                                            <div className="flex items-center gap-4">
                                                <div className="w-12 h-12 bg-[#D4AF37] text-black rounded-full flex items-center justify-center font-black text-xl">{CONFIG.chiSiamo.inizialeFondatore}</div>
                                                <div>
                                                    <p className="font-bold uppercase tracking-widest text-xs text-[#D4AF37]">{CONFIG.chiSiamo.nomeFondatore}</p>
                                                    <p className="text-slate-400 text-[10px] uppercase tracking-widest">{CONFIG.chiSiamo.ruoloFondatore}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-3 gap-8">
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-[#D4AF37]/10 hover:shadow-xl transition duration-300">
                                        <div className="w-14 h-14 bg-[#D4AF37]/10 text-[#D4AF37] rounded-2xl flex items-center justify-center mb-6"><i data-lucide="search-check" className="w-6 h-6"></i></div>
                                        <h4 className="text-xl font-black uppercase italic mb-3 text-slate-900">Selezione Rigorosa</h4>
                                        <p className="text-slate-500 leading-relaxed text-sm">Ogni auto proposta viene sottoposta a minuziosi controlli e revisioni complete dai nostri esperti, per assicurarti un acquisto sereno e assolutamente senza sorprese.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-[#D4AF37]/10 hover:shadow-xl transition duration-300">
                                        <div className="w-14 h-14 bg-[#D4AF37]/10 text-[#D4AF37] rounded-2xl flex items-center justify-center mb-6"><i data-lucide="handshake" className="w-6 h-6"></i></div>
                                        <h4 className="text-xl font-black uppercase italic mb-3 text-slate-900">Trasparenza</h4>
                                        <p className="text-slate-500 leading-relaxed text-sm">Crediamo in un rapporto di onestà e fiducia. Nessun costo nascosto o dettaglio omesso: ti forniamo tutta la cronologia e la verità sugli interventi del veicolo.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-[#D4AF37]/10 hover:shadow-xl transition duration-300">
                                        <div className="w-14 h-14 bg-[#D4AF37]/10 text-[#D4AF37] rounded-2xl flex items-center justify-center mb-6"><i data-lucide="shield-alert" className="w-6 h-6"></i></div>
                                        <h4 className="text-xl font-black uppercase italic mb-3 text-slate-900">Sicurezza Garantita</h4>
                                        <p className="text-slate-500 leading-relaxed text-sm">La tua tranquillità su strada è la nostra priorità. Mettiamo a disposizione garanzie su misura e assistenza dedicata, guidandoti dall'acquisto al post-vendita.</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-950 text-white py-16 px-6 mt-auto border-t-[6px] border-[#D4AF37]">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-12 border-b border-white/10 pb-12 mb-8">
                            <div>
                                <h4 className="font-black uppercase italic text-2xl mb-4">{CONFIG.nomeConcessionaria} <span className="text-[#D4AF37]">{CONFIG.citta}</span></h4>
                                <p className="text-slate-400 text-sm leading-relaxed mb-6 italic">{CONFIG.descrizioneFooter}</p>
                                <div className="flex gap-4">
                                    {CONFIG.social.instagram && (
                                        <a href={CONFIG.social.instagram} target="_blank" className="social-link w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all hover:bg-white/10 hover:border-[#D4AF37]">
                                            <img src={IG_ICON} className="social-icon-img" alt="Instagram" />
                                        </a>
                                    )}
                                    {CONFIG.social.facebook && (
                                        <a href={CONFIG.social.facebook} target="_blank" className="social-link w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all hover:bg-[#1877F2] hover:border-transparent">
                                            <img src={FB_ICON} className="social-icon-img" alt="Facebook" />
                                        </a>
                                    )}
                                    {CONFIG.social.autosupermarket && (
                                        <a href={CONFIG.social.autosupermarket} target="_blank" className="social-link w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center transition-all hover:bg-[#D4AF37] hover:border-transparent">
                                            <img src={LOGO_AUTOSUPERMARKET} className="social-icon-img rounded-md bg-white p-0.5" alt="Autosupermarket" />
                                        </a>
                                    )}
                                </div>
                            </div>
                            <div className="space-y-4">
                                <h5 className="font-bold uppercase text-xs tracking-widest text-[#D4AF37]">Contatti Rapidi</h5>
                                <div className="flex flex-col gap-3">
                                    <a href={`tel:${CONFIG.telefonoLink}`} className="text-slate-300 font-bold hover:text-white transition flex items-center gap-3">
                                        <div className="bg-[#D4AF37]/20 text-[#D4AF37] p-2 rounded-lg"><i data-lucide="phone" className="w-4 h-4"></i></div> 
                                        {CONFIG.telefonoMostrato}
                                    </a>
                                    <a href={`mailto:${CONFIG.email}`} className="text-slate-300 font-bold hover:text-white transition flex items-center gap-3 break-all">
                                        <div className="bg-[#D4AF37]/20 text-[#D4AF37] p-2 rounded-lg"><i data-lucide="mail" className="w-4 h-4"></i></div> 
                                        {CONFIG.email}
                                    </a>
                                </div>
                            </div>
                            <div className="space-y-4">
                                <h5 className="font-bold uppercase text-xs tracking-widest text-[#D4AF37]">Sede Operativa</h5>
                                <p className="text-slate-300 font-bold flex items-start gap-3">
                                    <div className="bg-[#D4AF37]/20 text-[#D4AF37] p-2 rounded-lg"><i data-lucide="map-pin" className="w-4 h-4"></i></div>
                                    <span>{CONFIG.indirizzo}<br/><span className="text-slate-500 font-medium">{CONFIG.cap} {CONFIG.citta} ({CONFIG.provinciaBreve})</span></span>
                                </p>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-[10px] font-bold uppercase tracking-widest opacity-40 italic">
                            <span>&copy; {new Date().getFullYear()} {CONFIG.nomeConcessionaria} {CONFIG.citta}</span>
                            <span>{CONFIG.provinciaEstesa}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
